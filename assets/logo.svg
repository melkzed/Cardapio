<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Villa Burger</title>
  <desc id="logo-desc">Selo circular preto com anel dourado, a palavra VILLA em dourado e BURGER em creme, com um hambúrguer no lugar da letra O.</desc>
  <defs>
    <linearGradient id="vb-ring" x1="30" y1="18" x2="172" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A6"/>
      <stop offset="0.3" stop-color="#F5C518"/>
      <stop offset="0.65" stop-color="#C98F00"/>
      <stop offset="1" stop-color="#FFD84D"/>
    </linearGradient>
    <linearGradient id="vb-villa" x1="60" y1="56" x2="140" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEDB4"/>
      <stop offset="0.45" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#DF9F00"/>
    </linearGradient>
    <linearGradient id="vb-disc" x1="46" y1="34" x2="158" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E2E2E"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="vb-bun-top" x1="112" y1="104" x2="142" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3C079"/>
      <stop offset="1" stop-color="#CE8734"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#vb-ring)"/>
  <circle cx="100" cy="100" r="87" fill="#0A0A0A"/>
  <circle cx="100" cy="100" r="83" fill="url(#vb-disc)"/>

  <!-- textLength trava a largura de cada palavra, entao o desenho fica igual
       mesmo onde a fonte pesada do sistema for diferente. -->
  <g font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900">
    <text x="100" y="86" font-size="44" textLength="112" lengthAdjust="spacingAndGlyphs"
          text-anchor="middle" fill="url(#vb-villa)"
          stroke="#6E4B00" stroke-width="1.4" paint-order="stroke">VILLA</text>
    <text x="39" y="130" font-size="38" textLength="68" lengthAdjust="spacingAndGlyphs"
          fill="#F3E9D2" stroke="#7E6E4C" stroke-width="1.1" paint-order="stroke">BURG</text>
    <text x="139" y="130" font-size="38" textLength="22" lengthAdjust="spacingAndGlyphs"
          fill="#F3E9D2" stroke="#7E6E4C" stroke-width="1.1" paint-order="stroke">R</text>
  </g>

  <g transform="translate(124 118)">
    <path d="M-15 -4c0-7.4 6.7-12.6 15-12.6S15 -11.4 15 -4Z" fill="url(#vb-bun-top)"/>
    <circle cx="-6" cy="-10" r="1.2" fill="#FFF3DC"/>
    <circle cx="1.5" cy="-12.3" r="1.2" fill="#FFF3DC"/>
    <circle cx="8.5" cy="-9" r="1.2" fill="#FFF3DC"/>
    <rect x="-15.5" y="-4" width="31" height="4.6" rx="2.3" fill="#F0A500"/>
    <path d="M-15.5 0.6h31l-3 3.9a4.4 4.4 0 0 1-3.4 1.6h-18.2a4.4 4.4 0 0 1-3.4-1.6Z" fill="#6FA524"/>
    <rect x="-15" y="4.4" width="30" height="5.2" rx="2.6" fill="#89491F"/>
    <path d="M-15 9c0 5 6.4 8.6 15 8.6s15-3.6 15-8.6Z" fill="#D9954A"/>
  </g>

  <path d="M48 150h104" stroke="#F3E9D2" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>
